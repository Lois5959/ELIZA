name: CI

on:
  push:
  pull_request:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt flake8
      - run: flake8 --select=E9,F,E722 .
      - run: pytest -q

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Les données versionnées correspondent aux générateurs
        run: make fetch && git diff --exit-code data/

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lillemove
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lillemove/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
